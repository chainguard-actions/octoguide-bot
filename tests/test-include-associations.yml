name: Test include associations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with custom include-associations
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config: recommended
          include-associations: "FIRST_TIMER,FIRST_TIME_CONTRIBUTOR"
      - name: Assert action completed with custom associations
        run: |
          echo "OctoGuide action completed successfully with custom include-associations"
          echo "PASS"
