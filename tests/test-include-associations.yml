name: Test include-associations option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide action with custom include-associations
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          include-associations: "FIRST_TIMER,FIRST_TIME_CONTRIBUTOR"
      - name: Assert action completed successfully with custom associations
        run: |
          echo "Action completed without error (exit 0) with custom include-associations"
          echo "PASS: OctoGuide action ran successfully with custom include-associations"
