name: Test basic usage - none config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with none config
        id: action
        uses: .
        with:
          config: none
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran (completed or failed gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to no real PR context, but it should not
          # crash with an unhandled exception at startup.
          # We accept both success and failure outcomes as long as it ran.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
