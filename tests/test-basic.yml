name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # OctoGuide acts on an issue/PR/discussion event payload. Under act the event is
      # workflow_dispatch and GITHUB_REPOSITORY is a sentinel repo, so the action may either
      # no-op successfully or fail gracefully; it must not be skipped.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (no entity to check under workflow_dispatch)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no entity / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
