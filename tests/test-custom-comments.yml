name: Test custom comment header and footer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with custom comment header and footer
        id: action
        uses: .
        with:
          comment-header: "## OctoGuide Review"
          comment-footer: "Powered by OctoGuide 🗺️"
        continue-on-error: true
      - name: Assert action completed with custom comment inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR/issue context, so the action may
          # exit with failure or success. Either is acceptable as long as the action
          # ran and did not crash the runner.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' using custom comment inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
