name: Test custom comment header and footer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide action with custom comment header and footer
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          comment-header: "## 🤖 OctoGuide Review"
          comment-footer: "Powered by OctoGuide automation."
      - name: Assert action completed successfully with custom comments
        run: |
          echo "Action completed without error (exit 0) with custom header/footer"
          echo "PASS: OctoGuide action ran successfully with custom comment header and footer"
