name: Test none config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with none config
        id: action
        uses: .
        with:
          config: none
        continue-on-error: true
      - name: Assert action completed with none config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With config=none all rules are disabled. Under workflow_dispatch there is
          # no PR/issue context, so the action may exit with failure or success.
          # Either is acceptable as long as the action ran without crashing the runner.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' using none config"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
