name: Test comment-header and comment-footer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          config: none
          comment-header: "## OctoGuide Review"
          comment-footer: "_Powered by OctoGuide_"
        # Testing that comment-header and comment-footer inputs are accepted.
        # The action may exit non-zero when there is no PR/issue context under
        # workflow_dispatch, so we allow failure and assert on the outcome.
        continue-on-error: true
      - name: Assert action ran (not skipped or cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
