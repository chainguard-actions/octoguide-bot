name: Test comment header and footer customization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          config: recommended
          github-token: fake-token-for-testing
          comment-header: "## OctoGuide Review"
          comment-footer: "Powered by OctoGuide"
        continue-on-error: true
      - name: Assert action ran with comment customization
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom comment header and footer"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
