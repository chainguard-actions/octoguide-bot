name: Test github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config: none
        continue-on-error: true
      - name: Assert action ran with github-token input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may succeed or fail depending on context (no PR/issue to act on),
          # but what matters is that it accepted the github-token input and ran.
          # A failure due to missing event context is acceptable; a failure due to
          # unrecognized input is not.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with github-token input"
