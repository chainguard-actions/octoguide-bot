name: Test explicit github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: recommended
      - name: Assert action exited successfully with explicit token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (workflow_dispatch payload has no entity, should exit early)"
            exit 1
          fi
          echo "PASS"
