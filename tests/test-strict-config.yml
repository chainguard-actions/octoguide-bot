name: Test strict config with custom comment options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with strict config and custom comment options
        id: action
        uses: .
        with:
          config: strict
          comment-header: "## OctoGuide Review"
          comment-footer: "Powered by OctoGuide"
          include-bots: "true"
          include-associations: "FIRST_TIMER,FIRST_TIME_CONTRIBUTOR,CONTRIBUTOR,NONE"
        continue-on-error: true
      - name: Assert action ran (outcome is success or failure, not skipped/cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
