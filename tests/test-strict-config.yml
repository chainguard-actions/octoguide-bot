name: Test strict config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with strict config
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config: strict
      - name: Assert action completed with strict config
        run: |
          echo "OctoGuide action completed successfully with strict config"
          echo "PASS"
