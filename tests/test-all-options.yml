name: Test config none with header, footer and include options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: none
          comment-header: "Custom header for tests"
          comment-footer: "Custom footer for tests"
          include-ais: "true"
          include-bots: "true"
          include-associations: "FIRST_TIMER,MEMBER,OWNER"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
