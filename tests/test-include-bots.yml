name: Test include-bots option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide action with include-bots enabled
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          include-bots: "true"
      - name: Assert action completed successfully with include-bots
        run: |
          echo "Action completed without error (exit 0) with include-bots=true"
          echo "PASS: OctoGuide action ran successfully with include-bots enabled"
