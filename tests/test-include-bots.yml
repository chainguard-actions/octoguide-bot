name: Test include bots
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with include-bots enabled
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config: recommended
          include-bots: "true"
      - name: Assert action completed with include-bots
        run: |
          echo "OctoGuide action completed successfully with include-bots enabled"
          echo "PASS"
