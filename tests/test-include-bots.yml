name: Test include-bots and custom comment options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          include-bots: "true"
          include-associations: "FIRST_TIMER,FIRST_TIME_CONTRIBUTOR,CONTRIBUTOR,COLLABORATOR"
          comment-header: "👋 Welcome! Here are some guidelines:"
          comment-footer: "Thanks for contributing!"
        # OctoGuide makes repo-scoped GitHub API calls; under the harness the
        # sentinel GITHUB_REPOSITORY does not exist, so the action is expected
        # to fail gracefully (Bad credentials / 404 on the sentinel repo).
      - name: Assert action ran with include-bots options (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with include-bots and custom comment options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
