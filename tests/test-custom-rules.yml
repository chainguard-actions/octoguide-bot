name: Test custom rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run OctoGuide with custom rules JSON
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config: recommended
          rules: '{"no-hello-world": "off"}'
      - name: Assert action completed with custom rules
        run: |
          echo "OctoGuide action completed successfully with custom rules"
          echo "PASS"
